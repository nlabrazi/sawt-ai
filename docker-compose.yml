version: "3.9"

services:
  api:
    build: ./api
    container_name: sawt_api
    env_file:
      - ./api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./training:/training

  ui:
    build: ./ui
    container_name: sawt_ui
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    ports:
      - "3000:3000"

volumes:
  ui_node_modules:
